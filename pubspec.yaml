name: smartstock_flutter_only
description: SmartStock - Flutter-only MVP with on-device NLU and Firestore transactions
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1


  # --- Firebase (família 4.x / 6.x) ---
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  cloud_functions: ^6.0.2
  firebase_data_connect: ^0.2.1

  # --- Utilidades ---
  shared_preferences: ^2.2.3
  share_plus: ^12.0.0      # <-- apenas esta linha; remova qualquer outra 'share_plus'
  intl: ^0.20.2
  http: ^1.2.2
  firebase_ai: ^3.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_black.png
    - assets/brand/logo_white.png
